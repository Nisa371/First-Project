spring:
  application:
    name: verified-career-marketplace-backend
  profiles:
    default: dev
  autoconfigure:
    # Authentication is implemented in M3; do not generate a bootstrap user.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  cv:
    directory: ${CV_STORAGE_DIRECTORY:uploads/cv}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
