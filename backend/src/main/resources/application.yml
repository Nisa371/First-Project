spring:
  application:
    name: verified-career-marketplace-backend
  profiles:
    default: dev
  autoconfigure:
    # Authentication is implemented in M3; do not generate a bootstrap user.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

app:
  trade-assistant:
    recent-message-limit: 12
  assessment:
    max-turns: ${ASSESSMENT_MAX_TURNS:6}
  ai:
    provider: ${AI_PROVIDER:UNCONFIGURED}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:}
    timeout: ${AI_TIMEOUT:30s}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      thinking-level: ${GEMINI_THINKING_LEVEL:low}
  demo-payment:
    job-posting-fee: ${DEMO_JOB_POSTING_FEE:500.00}
    session-booking-fee: ${DEMO_SESSION_BOOKING_FEE:100.00}
    currency: ${DEMO_PAYMENT_CURRENCY:BDT}
  verification:
    directory: ${VERIFICATION_STORAGE_DIRECTORY:uploads/verification}
  photo:
    directory: ${PHOTO_STORAGE_DIRECTORY:uploads/photos}
  cv:
    directory: ${CV_STORAGE_DIRECTORY:uploads/cv}
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
