spring:
  application:
    name: verified-career-marketplace-backend
  autoconfigure:
    # No generated in-memory user/password before authentication is implemented in M4.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # M1.2 development/test bootstrap only; M1.4/M2 formalize profiles and MySQL.
    url: jdbc:h2:mem:verified-career-marketplace
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
