spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:verified_career_marketplace}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:marketplace}
    # Public local/demo default only; override for private databases.
    password: ${DB_PASSWORD:marketplace123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Keeps existing data and creates/updates tables from your JPA entities.
      # Good for local development; production remains "validate".
      ddl-auto: update

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}
