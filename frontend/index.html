<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => { let theme; try { theme = localStorage.getItem('verified-career-theme') } catch {} if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Verified Career — a skills and employment marketplace for Bangladesh. Development service status." />
    <title>Verified Career | Development Home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
